{% extends 'core/base.html' %}

{% block content %}
    <h1>すべてのカテゴリ</h1>
    <ul>
        {% for c in categories %}
        <li>
            <a href="{{ url_for('forums.category', slug=c.slug) }}">
            {{ c.name }}
            </a>
        </li>
        {% endfor %}
    </ul>
{% endblock %}
