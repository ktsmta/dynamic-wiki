{% extends 'core/base.html' %}

{% block content %}

<h1>All categories</h1>
    <ul>
      {% for c in categories %}
        <li>
            <a href="{{ url_for('categories.category_top', slug=c.slug) }}">
            {{ c.name }}
            </a>
        </li>
      {% endfor %}
    </ul>

{% endblock %}
