<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="{{ url_for('core.static', filename='css/style.css') }}" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>
            {% block title %}{% endblock %}
            {% if self.title()|trim %}
                {{ self.title()|trim }} | DYNAMICWIKI
            {% else %}
                DYNAMICWIKI
            {% endif %}
        </title>
        {% block head %}{% endblock %}
    </head>
    <body>
        <div class="min-h-screen flex flex-col">
            <div class="bg-neutral-800 text-neutral-200 flex-1">
                {% include 'base/header.html' %}
                <div class="px-70 py-20">
                    {% block content %}{% endblock %}
                </div>
            </div>
            {% include 'base/footer.html' %}
        </div>
    </body>
</html>
