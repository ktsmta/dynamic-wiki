<nav class="sticky top-0 z-50 border-b border-black/10 bg-white/70 backdrop-blur">
  <div class="mx-auto max-w-6xl px-4 sm:px-6">
    <div class="flex h-16 items-center justify-between">
      <!-- Left: Brand -->
      <div class="flex items-center gap-3">
        <a href="{{ url_for('core.index') }}"
           class="inline-flex items-center gap-2 rounded-xl px-3 py-2 font-semibold tracking-tight hover:bg-black/5 transition">
          <span class="text-lg">Dynamic Wiki</span>
        </a>

        <!-- Optional: simple nav (必要なら増やしてください) -->
        <div class="hidden md:flex items-center gap-1">
          <a href="{{ url_for('core.index') }}"
             class="rounded-xl px-3 py-2 text-sm text-black/70 hover:bg-black/5 hover:text-black transition">
            ホーム
          </a>
          {# 例：カテゴリ一覧ページなどがあれば差し替え #}
          {# <a href="{{ url_for('main.index') }}" class="rounded-xl px-3 py-2 text-sm text-black/70 hover:bg-black/5 hover:text-black transition">掲示板</a> #}
        </div>
      </div>

      <!-- Right: Auth -->
      <div class="flex items-center gap-2">
        {% if current_user.is_authenticated %}
          <div class="hidden sm:flex items-center gap-2">
            <span class="text-sm text-black/60">Signed in as</span>
            <span class="text-sm font-semibold">{{ current_user.username }}</span>
          </div>

          <form method="POST" action="{{ url_for('auth.logout') }}" class="ml-1">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit"
                    class="inline-flex items-center rounded-xl border border-black/10 bg-white px-4 py-2 text-sm font-semibold
                           hover:bg-black/5 active:bg-black/10 transition">
              ログアウト
            </button>
          </form>
        {% else %}
          <a href="{{ url_for('auth.login') }}"
             class="inline-flex items-center rounded-xl px-4 py-2 text-sm font-semibold text-black/80 hover:bg-black/5 transition">
            ログイン
          </a>
          <a href="{{ url_for('auth.signup') }}"
             class="inline-flex items-center rounded-xl bg-black px-4 py-2 text-sm font-semibold text-white
                    hover:opacity-90 active:opacity-80 transition">
            サインアップ
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
