{% extends 'base/.html' %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="bg-neutral-900/50 rounded-2xl shadow-[0_0_2rem_0.5rem_rgba(20,148,20,1)] p-8">
      <div class="mb-6">
        <h1 class="text-3xl text-center font-bold tracking-tight">ログイン</h1>
      </div>

      <form method="POST" action="{{ url_for('auth.login', next=next) }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next }}">

        <div>
          <input
            type="email"
            name="email"
            autocomplete="email"
            required
            placeholder="メールアドレス"
            class="text-black mt-2 w-full rounded-xl border border-black/10 bg-neutral-300 px-4 py-3 outline-none
                   focus:ring-2 focus:ring-black/20 focus:border-black/20"
          >
        </div>

        <div>
          <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
            placeholder="パスワード"
            class="text-black w-full rounded-xl border border-black/10 bg-neutral-300 px-4 py-3 outline-none
                   focus:ring-2 focus:ring-black/20 focus:border-black/20"
          >
        </div>

        <button
          type="submit"
          class="w-full rounded-xl bg-green-800 text-white py-3 font-semibold
                 hover:opacity-90 active:opacity-80 transition"
        >
          ログイン
        </button>
        
        <div class="flex flex-col pt-1 text-xs">
          <div class="text-right text-xs">
            <p>初めてですか？</p>
          </div>
          <div class="text-glay-500 text-right">
            <a
              href="{{ url_for('auth.signup', next=next) }}"
              class="font-semibold text-glay-500 underline text-sm"
            >
              サインアップ
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
