{% extends 'base/.html' %}

{% block content %}
<div class="p-6 md:p-10">
  <div class="mx-auto max-w-3xl">

    <!-- Header / Breadcrumb -->
    <div class="flex flex-col gap-6">
      <p class="text-sm text-gray-500">
        <a href="{{ url_for('core.index') }}" class="underline underline-offset-4 hover:text-gray-700">ホーム</a>
        <span class="mx-2 text-gray-300">/</span>
        <a href="{{ url_for('main.category_detail', slug=category.slug) }}" class="underline underline-offset-4 hover:text-gray-700">
          {{ category.name }}
        </a>
        <span class="mx-2 text-gray-300">/</span>
        <span class="text-gray-700">新しいスレッド</span>
      </p>

      <div class="flex flex-col gap-2">
        <h1 class="text-3xl md:text-4xl font-semibold tracking-tight text-gray-900">
          新しいスレッドを作成
        </h1>
        <p class="text-gray-600">
          カテゴリ：<span class="font-medium text-gray-900">{{ category.name }}</span>
        </p>
      </div>

      <div class="border-t border-gray-200"></div>
    </div>

    <!-- Form Card -->
    <div class="mt-8 rounded-2xl border border-gray-200 bg-white shadow-sm overflow-hidden">
      <div class="px-5 py-4 border-b border-gray-200 bg-gray-50">
        <p class="text-base font-semibold text-gray-900">スレッド情報</p>
        <p class="mt-1 text-sm text-gray-600">タイトルと本文（最初の投稿）を入力してください。</p>
      </div>

      <div class="p-5">
        <form method="POST" action="{{ url_for('main.thread_new', slug=category.slug) }}" class="space-y-5">
          <!-- CSRF（Flask-WTF CSRFProtect 対応） -->
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <!-- Thread type -->
          <div>
            <p class="block text-sm font-semibold text-gray-900">スレッド種別</p>
            <p class="mt-1 text-xs text-gray-500">目的に近い方を選ぶと、後でWiki整理や検索が楽になります。</p>

            <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
              <label class="flex items-start gap-3 rounded-2xl border border-gray-300 bg-white px-4 py-3 shadow-sm hover:bg-gray-50 cursor-pointer">
                <input
                  type="radio"
                  name="thread_type"
                  value="question"
                  class="mt-1"
                  checked
                >
                <div class="min-w-0">
                  <p class="text-sm font-semibold text-gray-900">質問</p>
                  <p class="text-xs text-gray-600">答え・手順・正解に近い情報が欲しい</p>
                </div>
              </label>

              <label class="flex items-start gap-3 rounded-2xl border border-gray-300 bg-white px-4 py-3 shadow-sm hover:bg-gray-50 cursor-pointer">
                <input
                  type="radio"
                  name="thread_type"
                  value="discussion"
                  class="mt-1"
                >
                <div class="min-w-0">
                  <p class="text-sm font-semibold text-gray-900">議論</p>
                  <p class="text-xs text-gray-600">意見・比較・方針などを深掘りしたい</p>
                </div>
              </label>
            </div>
          </div>

          <div>
            <label for="title" class="block text-sm font-semibold text-gray-900">タイトル</label>
            <input
              id="title"
              name="title"
              type="text"
              required
              maxlength="200"
              placeholder="例）ZTAポリシーの適用範囲について"
              class="mt-2 w-full rounded-2xl border border-gray-300 bg-white px-4 py-3 text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400"
            >
            <p class="mt-2 text-xs text-gray-500">※短く要点が分かるタイトルがおすすめです。</p>
          </div>

          <div>
            <label for="content" class="block text-sm font-semibold text-gray-900">本文（最初の投稿）</label>
            <textarea
              id="content"
              name="content"
              rows="8"
              required
              placeholder="背景、前提条件、聞きたいこと、試したこと、などを書いてください。"
              class="mt-2 w-full rounded-2xl border border-gray-300 bg-white px-4 py-3 text-gray-900 shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-400"
            ></textarea>
            <p class="mt-2 text-xs text-gray-500">※改行はそのまま表示されます。</p>
          </div>

          <div class="pt-2">
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
              <button
                type="submit"
                class="inline-flex items-center justify-center rounded-xl bg-gray-900 px-6 py-3 text-sm font-semibold text-white shadow-sm hover:bg-gray-800 active:scale-[0.99] transition w-full sm:w-auto"
              >
                作成して投稿
              </button>

              <a
                href="{{ url_for('main.thread_all', slug=category.slug) }}"
                class="inline-flex items-center justify-center rounded-xl border border-gray-300 bg-white px-6 py-3 text-sm font-semibold text-gray-900 shadow-sm hover:bg-gray-50 active:scale-[0.99] transition w-full sm:w-auto"
              >
                一覧へ戻る
              </a>

              <a
                href="{{ url_for('main.category_detail', slug=category.slug) }}"
                class="inline-flex items-center justify-center rounded-xl border border-gray-300 bg-white px-6 py-3 text-sm font-semibold text-gray-900 shadow-sm hover:bg-gray-50 active:scale-[0.99] transition w-full sm:w-auto"
              >
                カテゴリへ戻る
              </a>
            </div>

            <p class="mt-4 text-center text-xs text-gray-500">
              ※作成すると「最初の投稿」が同時に作成されます。
            </p>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
