{% extends 'base/.html' %}

{% block content %}
<div>
    <div class="text-4xl">
        <p>すべてのカテゴリ</p>
    </div>
    <div class="grid grid-cols-3 gap-6 mt-6">
        {% for category in categories %}
            <a href="{{ url_for('main.category_detail', slug=category.slug) }}" class="block p-6 bg-white rounded shadow hover:bg-gray-50">
                <h2 class="text-2xl">
                    {{ category.name }}
                </h2>
                <p class="text-sm text-gray-500 mt-2">
                    /{{ category.slug }}
                </p>
            </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
